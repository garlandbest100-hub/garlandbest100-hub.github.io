<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.subtabs [role="tab"]'));
  var lead = document.getElementById('tab-lead');
  var keys = tabs.map(function (t) { return t.dataset.key; });

  function show(key, updateHash) {
    if (keys.indexOf(key) === -1) key = keys[0];
    tabs.forEach(function (t) {
      var on = t.dataset.key === key;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById('panel-' + t.dataset.key).hidden = !on;
      if (on) lead.textContent = t.dataset.lead;
    });
    if (updateHash) history.replaceState(null, '', '#' + key);
  }

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.dataset.key, true); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      var n = tabs[(i + d + tabs.length) % tabs.length];
      n.focus();
      show(n.dataset.key, true);
    });
  });

  window.addEventListener('hashchange', function () { show(location.hash.slice(1), false); });
  show(location.hash.slice(1), false);
})();
</script>
